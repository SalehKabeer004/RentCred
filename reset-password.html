<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <div class="container">
        <div class="heading">Reset Password</div>
        <form class="form" id="reset-password-form">
            <input required class="input" type="email" id="reset-password-email" placeholder="E-mail">
            <input required class="input" type="password" id="reset-password" placeholder="New Password">
            <input required class="input" type="password" id="confirm-reset-password"
                placeholder="Confirm New Password">
            <input class="login-button" type="submit" value="Reset Password">
        </form>
    </div>

</body>
<script type="module" src="dbConnection.js"></script>
<script type="module" src="app.js"></script>
<script type="module" src="script.js"></script>
<script type="module" src="auth.js"></script>

</html>
