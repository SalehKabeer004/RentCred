<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="sign-up.css">
</head>

<body>
    <div class="container">
        <div class="heading">Create Account
        </div>
        <form action="" class="form">
            <div class="names" style="display: flex; gap: 10px;">
                <input required="" class="input" type="text" name="text" id="email" placeholder="First Name">
                <input required="" class="input" type="text" name="text" id="email" placeholder="Last Name">

            </div>
            <select name="role" id="role">
                <option value="Role">Role</option>
                <option value="Seller">Seller</option>
                <option value="Buyer">Buyer</option>
            </select>
            <input required="" class="input" type="email" name="email" id="email" placeholder="E-mail">
            <input required="" class="input" type="password" name="password" id="password" placeholder="Password">
            <input required="" class="input" type="password" name="password" id="password"
                placeholder="Confirm Password">
            <span class="forgot-password">I hava already account <a href="./login.html"
                    style="font-size: 15px;">Login</a></span>
            <input class="login-button" type="submit" value="Create Account">

        </form>
        <div class="social-account-container">
            <span class="title">Or Sign up with</span>
            <div class="social-accounts">
                <a href="#"><i class="fa-brands fa-google"></i></a>
                <a href="#"><i class="fa-brands fa-apple"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
            </div>
        </div>
    </div>
</body>

</html>
