<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="sign-up.css">
</head>

<body>
    <div class="container">
        <div class="heading">Create Account
        </div>   
        <form id="signup-form" class="form">
            <div class="names" style="display: flex; gap: 10px;">
                <input required class="input" type="text" id="first-name" placeholder="First Name">
                <input required class="input" type="text" id="last-name" placeholder="Last Name">
            </div>

            <select name="role" id="role" required>
                <option value="" disabled selected>Select Role</option>
                <option value="owner">Property Owner</option>
                <option value="renter">Renter</option>
            </select>

            <input required class="input" type="email" id="signup-email" placeholder="E-mail">
            <input required class="input" type="password" id="signup-password" placeholder="Password">
            <input required class="input" type="password" id="confirm-password" placeholder="Confirm Password">
            <span class="sign_in_page"><a href="./login.html">I have already account</a></span>

            <input class="login-button" type="submit" value="Create Account">
        </form>
        <div class="social-account-container">
            <span class="title">Or Sign up with</span>
            <div class="social-accounts">
                <a href="#"><i class="fa-brands fa-google"></i></a>
                <a href="#"><i class="fa-brands fa-apple"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
            </div>
        </div>
    </div>
</body>
<!-- <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> -->
<script type="module" src="dbConnection.js"></script>
<script type="module" src="app.js"></script>
<script type="module" src="script.js"></script>
<script type="module" src="auth.js"></script>

</html>
